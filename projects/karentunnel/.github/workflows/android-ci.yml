name: android-ci

on:
  push:
    branches: [main]
    paths: ["projects/karentunnel/**"]
  pull_request:
    paths: ["projects/karentunnel/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/karentunnel

jobs:
  build-and-test:
    name: assemble + unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned dependencies resolve
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Unit tests (all modules)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint (release-blocking)
        run: ./gradlew lintDebug --stacktrace

      - name: Publish test + lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            projects/karentunnel/**/build/reports/
            projects/karentunnel/**/build/test-results/
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karentunnel-debug-apk
          path: projects/karentunnel/app/build/outputs/apk/debug/*.apk
          retention-days: 14
