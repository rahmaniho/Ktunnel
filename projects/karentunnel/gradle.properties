# JVM: the build is memory-hungry because of Compose + AGP.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Parallel + caching for CI speed and reproducibility.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin / AndroidX
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Lint is release-blocking in CI; locally it stays fast.
android.lint.checkReleaseBuilds=true
