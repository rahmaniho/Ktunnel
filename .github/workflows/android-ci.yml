name: android-ci

on:
  push:
    # Any branch: agent work happens on arena/* branches and must be verified
    # before it reaches main, not after.
    paths: ["projects/karentunnel/**"]
  pull_request:
    paths: ["projects/karentunnel/**"]
  workflow_dispatch:

permissions:
  contents: read
  # Needed to publish compiler/test diagnostics as a commit status, because
  # Actions log archives are not reachable from the development sandbox.
  statuses: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/karentunnel

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

jobs:
  build-and-test:
    name: assemble + unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (commandline-tools, no third-party action)
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TOOL_CACHE/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT/cmdline-tools"
          if [ ! -d latest ]; then
            curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip
            mv cmdline-tools latest
            rm tools.zip
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" >/dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned dependencies resolve
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Unit tests (all modules)
        id: tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::gradle failed with status $status"
          fi
          exit "$status"

      - name: Report failure details as a commit status
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -E '(^e: |error:|FAILED|Execution failed for task|Cause:)' /tmp/gradle.log 2>/dev/null | head -60 > errors.txt || true
          # The sandbox this repo is developed in cannot download Actions logs,
          # so the first actionable errors are surfaced in the commit status.
          msg=$(grep -E '(^e: |error:|FAILED|Execution failed for task|Cause:)' /tmp/gradle.log 2>/dev/null | head -18 | tr '\n' ' ' | cut -c1-920)
          [ -z "$msg" ] && msg="gradle failed before producing diagnostics; see artifacts/test-results"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=android-ci/errors -f description="$msg" >/dev/null || true

      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E '(^e: |error:|FAILED|Execution failed for task)' /tmp/gradle.log | tail -18 | tr '\n' ' ' | cut -c1-920)
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context=android-ci/errors -f description="$msg" >/dev/null || true
          fi
          exit "$status"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint (release-blocking)
        run: ./gradlew lintDebug --stacktrace

      - name: Publish test + lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            projects/karentunnel/**/build/reports/
            projects/karentunnel/**/build/test-results/
            projects/karentunnel/errors.txt
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karentunnel-debug-apk
          path: projects/karentunnel/app/build/outputs/apk/debug/*.apk
          retention-days: 14
